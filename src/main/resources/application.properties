# Application name
spring.application.name=springbasic

#assign application port number 

server.address=0.0.0.0
server.port=8080

# MySQL database connection
spring.application.name=springbasic

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/springbasic_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:springbasic_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

